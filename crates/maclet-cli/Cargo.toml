[package]
name = "maclet-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "maclet"
path = "src/main.rs"

[dependencies]
maclet-common = { path = "../maclet-common" }
maclet-ipc = { path = "../maclet-ipc" }
maclet-vm = { path = "../maclet-vm" }
maclet-image = { path = "../maclet-image" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["full"] }
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
anyhow = "1.0"
